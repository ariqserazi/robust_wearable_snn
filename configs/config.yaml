experiment_name: "uci_har_spiking_reservoir"
seeds: [0, 1, 2, 3, 4]

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  include_total_acc: true
  sampling_rate_hz: 50.0
  window_length: 128
  dt_ms: 20.0
  val_participant_count: 5

corruption:
  mask_seed: 202610
  intermittent_fractions: [0.0, 0.10, 0.20, 0.30, 0.40]

reservoir:
  pilot_sizes: [128, 256]
  n_neurons: 128
  p_rec: 0.15
  excitatory_fraction: 0.80
  spectral_radius: 0.90
  input_scale: 0.65
  v_th: 1.0
  v_reset: 0.0
  refractory_steps: 0
  bias_current: 0.15
  n_temporal_bins: 4

tuning:
  readout_alpha_grid: [5.0, 10.0, 20.0, 30.0]
  homogeneous_tau_candidates_ms:
    - 20.0
    - 40.0
    - 80.0
    - 160.0
    - 320.0
    - 640.0
  heterogeneous_tau_candidates_ms:
    - [20.0, 80.0, 320.0]
    - [20.0, 120.0, 480.0]
    - [25.0, 100.0, 400.0]
    - [30.0, 150.0, 600.0]
    - [20.0, 160.0, 640.0]
    - [40.0, 160.0, 640.0]
