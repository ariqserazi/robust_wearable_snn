experiment_name: "uci_har_multitimescale_spiking_reservoir"
seeds: [0, 1, 2, 3, 4]

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  include_total_acc: true          # 9 inertial channels (body_acc x/y/z, body_gyro x/y/z, total_acc x/y/z)
  sampling_rate_hz: 50.0
  window_length: 128               # 2.56 seconds at 50 Hz
  dt_ms: 20.0                      # 1000 / 50 Hz = 20 ms per sample
  val_participant_count: 5         # 5 of 21 training participants held out for validation (0 participant overlap)

corruption:
  mask_seed: 202610
  intermittent_fractions: [0.0, 0.10, 0.20, 0.30, 0.40]

reservoir:
  pilot_sizes: [128, 256]
  n_neurons: 128                   # Selected via Milestone 1 Runtime Pilot (3x faster than 256, 0% silent neurons)
  p_rec: 0.15                      # Recurrent connection probability
  excitatory_fraction: 0.80        # 80% excitatory, 20% inhibitory (Dale's principle)
  spectral_radius: 0.90            # Recurrent weight spectral scaling
  input_scale: 0.65                # Input current scaling factor
  v_th: 1.0                        # Spike threshold
  v_reset: 0.0                     # Reset potential
  refractory_steps: 0              # Discrete steps (20 ms each)
  bias_current: 0.15               # Baseline tonic drive to prevent silent neurons
  n_temporal_bins: 4               # Summarize postsynaptic traces over 4 sub-windows (32 steps each)

tuning:
  # Equal tuning budget: 6 candidate timescale configurations x 4 readout regularization values (24 configs each)
  # Selected strictly on clean training-participant validation data (Slide 4 & Slide 9 protocol)
  readout_alpha_grid: [5.0, 10.0, 20.0, 30.0]
  homogeneous_tau_candidates_ms:
    - 20.0
    - 40.0
    - 80.0
    - 160.0
    - 320.0
    - 640.0
  heterogeneous_tau_candidates_ms:
    # Each entry is [tau_fast, tau_medium, tau_slow] in ms (1/3 of neurons each, plus log-jitter)
    - [20.0, 80.0, 320.0]
    - [20.0, 120.0, 480.0]
    - [25.0, 100.0, 400.0]
    - [30.0, 150.0, 600.0]
    - [20.0, 160.0, 640.0]
    - [40.0, 160.0, 640.0]
